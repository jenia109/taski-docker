name: Main Taski workflow

on:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13.10
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: django_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install flake8==7.3.0 flake8-isort==7.0.0
          pip install -r ./backend/requirements.txt
      - name: Test with flake8 and django tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: django_db
          DB_USER: django_user
          DB_PASSWORD: password
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: django_db
        run: |
          python -m flake8 backend/
          cd backend/
          python manage.py test

  build_and_push_to_docker_hub:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: \${{ secrets.DOCKERHUB_USERNAME }}
          password: \${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./backend/
          file: ./backend/Dockerfile
          push: true
          tags: larchdevs/taski-backend:latest

  frontend_tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore npm cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Test frontend
        run: npm run test --prefix frontend

  build_frontend_and_push_to_docker_hub:
    name: Push frontend Docker image to DockerHub
    runs-on: ubuntu-24.04
    needs: frontend_tests
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: \${{ secrets.DOCKERHUB_USERNAME }}
          password: \${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/
          push: true
          tags: larchdevs/taski_frontend:latest

  build_gateway_and_push_to_docker_hub:
    name: Push gateway Docker image to DockerHub
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: \${{ secrets.DOCKERHUB_USERNAME }}
          password: \${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: ./gateway/
          push: true
          tags: larchdevs/taski_gateway:latest

  deploy:
    runs-on: ubuntu-latest
    needs: 
      - build_and_push_to_docker_hub
      - build_frontend_and_push_to_docker_hub
      - build_gateway_and_push_to_docker_hub
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Copy docker-compose file to server
        uses: appleboy/scp-action@master
        with:
          host: \${{ secrets.HOST }}
          username: \${{ secrets.USER }}
          key: \${{ secrets.SSH_KEY }}
          source: "docker-compose.production.yml"
          target: "/home/ubuntu/taski/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: \${{ secrets.HOST }}
          username: \${{ secrets.USER }}
          key: \${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/taski
            
            if [ ! -f docker-compose.production.yml ]; then
              echo "ERROR: docker-compose.production.yml not found!"
              exit 1
            fi
            
            if [ ! -f .env ]; then
              echo "ERROR: .env file not found!"
              exit 1
            fi
            
            if [ ! -r .env ]; then
              echo "ERROR: .env file is not readable!"
              exit 1
            fi
            
            echo "Stopping old containers..."
            sudo docker compose -f docker-compose.production.yml down
            
            echo "Pulling latest images..."
            if ! sudo docker compose -f docker-compose.production.yml pull; then
              echo "ERROR: Failed to pull images."
              exit 1
            fi
            
            echo "Starting new containers..."
            sudo docker compose -f docker-compose.production.yml up -d
            
            echo "Waiting for services to initialize..."
            sleep 15
            
            echo "Running migrations..."
            if ! sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py migrate --noinput; then
              echo "ERROR: Migrations failed!"
              exit 1
            fi
            
            echo "Collecting static files..."
            if ! sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --noinput; then
              echo "ERROR: Collectstatic failed!"
              exit 1
            fi
            
            echo "Deploy finished successfully!"
