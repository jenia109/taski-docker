volumes:
  pg_data_production:
  static_volume:

services:
  db:
    image: postgres:15
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
    restart: always

  backend:
    image: larchdevs/taski-backend
    env_file: .env
    volumes:
      - static_volume:/backend_static
    restart: always

  frontend:
    image: larchdevs/taski_frontend
    env_file: .env
    command: sh -c "cp -r /app/build/. /frontend_static/ && sleep infinity"
    volumes:
      - static_volume:/frontend_static
    restart: always

  gateway:
    image: larchdevs/taski_gateway
    env_file: .env
    volumes:
      - static_volume:/staticfiles/
    ports:
      - "8000:80"
    restart: always
    depends_on:
      - backend
