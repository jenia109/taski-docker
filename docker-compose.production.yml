volumes:
  pg_data_production:
  static_volume:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data

  backend:
    image: larchdevs/taski_backend
    env_file: .env
    volumes:
      - static_volume:/backend_static

  frontend:
    image: larchdevs/taski_frontend
    env_file: .env
    command: sh -c "cp -r /app/build/. /frontend_static/ && sleep infinity"
    volumes:
      - static_volume:/frontend_static

  gateway:
    image: larchdevs/taski-gateway
    env_file: .env
    volumes:
      - static_volume:/staticfiles/
    ports:
      - "8000:80"
